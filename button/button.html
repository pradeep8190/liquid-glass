<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Glass Button</title>
  <link rel="stylesheet" href="button-style.css">
</head>
<body>

  <div class="showcase-container">
    <!-- Studio Card Frame with Signature Bottom-Left Curved Corner -->
    <div class="studio-card-wrapper" id="cardWrapper">
      <div class="stage-container" id="stageContainer">
        <!-- GPU Optical Shader Canvas -->
        <canvas id="glcanvas"></canvas>

        <!-- Dynamic 2D Background Rasterizer -->
        <canvas id="bgCanvas"></canvas>

        <!-- Glass Card Action Menu (5 Compact Buttons with Fluid Interactions) -->
        <div class="card-actions-menu" id="cardActionsMenu" aria-hidden="true">
          <!-- Fluid Optical Hover Glider -->
          <div class="hover-glider" id="hoverGlider"></div>

          <!-- Dedicated Close Anchor Over Bottom-Left X Button -->
          <div class="card-close-anchor" id="cardCloseAnchor" role="button" aria-label="Close Liquid Glass Card"></div>

          <button class="card-action-btn" data-action="new-doc" type="button" style="--item-idx: 4;">
            <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
            <span class="action-label">New Document</span>
          </button>

          <button class="card-action-btn" data-action="upload" type="button" style="--item-idx: 3;">
            <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <span class="action-label">Upload File</span>
          </button>

          <button class="card-action-btn" data-action="voice" type="button" style="--item-idx: 2;">
            <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
            <span class="action-label">Voice Memo</span>
          </button>

          <button class="card-action-btn" data-action="scan" type="button" style="--item-idx: 1;">
            <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
              <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
              <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
              <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
              <line x1="7" y1="12" x2="17" y2="12"></line>
            </svg>
            <span class="action-label">Scan Code</span>
          </button>

          <button class="card-action-btn" data-action="link" type="button" style="--item-idx: 0;">
            <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
            <span class="action-label">Share Link</span>
          </button>
        </div>

        <!-- Tactile Button Touch Overlay -->
        <div class="touch-overlay" id="touchOverlay" role="button" aria-label="Liquid Glass Add Button"></div>
      </div>
    </div>
  </div>

  <!-- Modular Scripts -->
  <script src="button-shaders.js"></script>
  <script src="button-app.js"></script>
</body>
</html>
